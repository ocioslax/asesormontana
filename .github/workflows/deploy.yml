name: Deploy Pipeline - Asesor de Seguridad en Alta Montaña

on:
  pull_request:
    branches:
      - development
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  pr-review-and-validate:
    name: PR Validation & Branch Protection Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Integridad de Prompt y Modelos
        run: |
          python -m py_compile src/main.py
          python -c "from src import main; assert main.app is not None"
          echo "Validación de PR aprobada."

  docker-image-build:
    name: Build Docker Image
    needs: pr-review-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mountain-advisor:latest

